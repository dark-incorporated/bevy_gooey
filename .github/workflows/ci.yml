# CI for bevy_gooey.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (standalone) + test
    runs-on: [self-hosted, big]
    # big's runner is shared with every sibling repo and its RAM is what runs short: the same limits as
    # the local gate, so one job does not take every core's worth of compilers and test processes.
    env:
      CARGO_BUILD_JOBS: 3
      NEXTEST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # A plain `cargo build` takes no dev-dependencies, so it compiles exactly the trimmed Bevy
      # features a consumer gets; the full `bevy` dev-dependency would hide a hole in the list.
      - name: Build with only the declared features
        run: cargo build

      # Includes tests/leaf.rs (the boundary ratchet), tests/skin.rs and tests/nav.rs (every file in
      # tests/ is a module of the one `all` binary). `--lib --tests`, never a bare `cargo test`: the
      # bare form also links all 26 examples into 700 MB executables, which is what filled big's disk
      # (AGENTS.md, "the gate").
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --all-features --lib --tests --no-fail-fast

      - name: Doctests (nextest does not run them)
        run: cargo test --all-features --doc

      - name: Test (readme)
        run: cargo nextest run --all-features -E 'binary(all) & test(readme::)'

      # The examples need a window at run time, not build time, so type-checking them is the check that
      # fits in CI. `cargo build --examples` LINKED all 37 in parallel and the linker was OOM-killed
      # (`ld terminated with signal 9`) in 11 of the last 12 runs; `cargo check` links nothing.
      - name: Check examples
        run: cargo check --examples --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
